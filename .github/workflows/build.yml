name: Сборка APK

# Когда запускается:
#  - push в main            → собрать APK и выложить в Releases
#  - pull request           → только собрать (проверка, что ничего не сломано)
#  - вручную (кнопка Run)   → только собрать
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы создавать Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      # Названия тестов написаны по-русски — отчётам нужна кодировка UTF-8.
      LC_ALL: C.UTF-8
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Настроить Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      # Debug-ключ подписи не хранится в репозитории. Чтобы новая сборка
      # ставилась поверх старой без удаления, держим один и тот же ключ в кэше.
      - name: Достать debug-ключ из кэша
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Создать debug-ключ, если его ещё нет
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      # Постоянный ключ подписи лежит в GitHub Secrets (в репозитории его нет).
      # С ним собирается release-версия, и обновления всегда ставятся поверх старой.
      - name: Достать постоянный ключ подписи из секретов
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.PULSE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/pulse.p12"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
            echo "Постоянный ключ найден: собираем release."
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Секретов нет: собираем debug с временным ключом."
          fi

      - name: Прогнать тесты и собрать APK (release, постоянный ключ)
        if: steps.signing.outputs.enabled == 'true'
        env:
          PULSE_KEYSTORE_FILE: ${{ runner.temp }}/pulse.p12
          PULSE_KEYSTORE_PASSWORD: ${{ secrets.PULSE_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew testDebugUnitTest assembleRelease -PbuildNumber="$BUILD_NUMBER" --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "pulse-build-$BUILD_NUMBER.apk"
          rm -f "$RUNNER_TEMP/pulse.p12"

      - name: Прогнать тесты и собрать APK (debug, временный ключ)
        if: steps.signing.outputs.enabled != 'true'
        run: |
          ./gradlew testDebugUnitTest assembleDebug -PbuildNumber="$BUILD_NUMBER" --stacktrace
          cp app/build/outputs/apk/debug/app-debug.apk "pulse-build-$BUILD_NUMBER.apk"

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: pulse-build-${{ github.run_number }}
          path: pulse-build-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Опубликовать в Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$BUILD_NUMBER" "pulse-build-$BUILD_NUMBER.apk" \
            --target "$GITHUB_SHA" \
            --title "Сборка $BUILD_NUMBER" \
            --notes "Сборка №$BUILD_NUMBER. Скачайте файл pulse-build-$BUILD_NUMBER.apk ниже (раздел Assets) и откройте его на телефоне."
