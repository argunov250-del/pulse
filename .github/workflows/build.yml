name: Сборка APK

# Когда запускается:
#  - push в main            → собрать APK и выложить в Releases
#  - pull request           → только собрать (проверка, что ничего не сломано)
#  - вручную (кнопка Run)   → только собрать
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # нужно, чтобы создавать Release

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Собрать debug-APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - name: Скачать код
        uses: actions/checkout@v4

      - name: Установить Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Настроить Gradle (с кэшем)
        uses: gradle/actions/setup-gradle@v4

      # Debug-ключ подписи не хранится в репозитории. Чтобы новая сборка
      # ставилась поверх старой без удаления, держим один и тот же ключ в кэше.
      - name: Достать debug-ключ из кэша
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Создать debug-ключ, если его ещё нет
        run: |
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            mkdir -p "$HOME/.android"
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android -keypass android \
              -alias androiddebugkey \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Собрать APK
        run: ./gradlew assembleDebug -PbuildNumber="$BUILD_NUMBER" --stacktrace

      - name: Переименовать APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "pulse-build-$BUILD_NUMBER.apk"

      - name: Выложить APK как артефакт
        uses: actions/upload-artifact@v4
        with:
          name: pulse-build-${{ github.run_number }}
          path: pulse-build-${{ github.run_number }}.apk
          if-no-files-found: error

      - name: Опубликовать в Releases
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-$BUILD_NUMBER" "pulse-build-$BUILD_NUMBER.apk" \
            --target "$GITHUB_SHA" \
            --title "Сборка $BUILD_NUMBER" \
            --notes "Debug-сборка №$BUILD_NUMBER. Скачайте файл pulse-build-$BUILD_NUMBER.apk ниже (раздел Assets) и откройте его на телефоне."
